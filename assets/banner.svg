<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }
    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .floating-node {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .dash-line {
      stroke-dasharray: 6, 6;
      animation: dashCycle 20s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs (Dynamic Pulse) -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.08" class="pulsing-orb" filter="url(#glow)"/>
  <circle cx="1020" cy="180" r="160" fill="#818cf8" opacity="0.09" class="pulsing-orb" style="animation-delay: -3s;" filter="url(#glow)"/>
  <circle cx="650" cy="300" r="120" fill="#34d399" opacity="0.06" class="pulsing-orb" style="animation-delay: -1.5s;" filter="url(#glow)"/>

  <!-- Right-side Visual: Financial Chart & Network Graph -->
  <g transform="translate(680, 40)" opacity="0.95">
    <!-- Chart Background Area -->
    <path d="M 40 220 L 100 170 L 160 190 L 220 130 L 280 150 L 340 80 L 400 100 L 460 30 L 460 250 L 40 250 Z" fill="url(#chartGlow)" />
    
    <!-- Chart Trend Line -->
    <path d="M 40 220 L 100 170 L 160 190 L 220 130 L 280 150 L 340 80 L 400 100 L 460 30" fill="none" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-subtle)"/>
    
    <!-- Moving Dash Guideline -->
    <line x1="40" y1="250" x2="460" y2="250" stroke="#334155" stroke-width="1.5" />
    <line x1="40" y1="140" x2="460" y2="140" stroke="#334155" stroke-width="1" class="dash-line" opacity="0.4"/>
    <line x1="40" y1="60" x2="460" y2="60" stroke="#334155" stroke-width="1" class="dash-line" opacity="0.4"/>

    <!-- Data Points / Interactive Nodes -->
    <circle cx="100" cy="170" r="5" fill="#38bdf8" filter="url(#glow-subtle)"/>
    <circle cx="220" cy="130" r="5" fill="#818cf8" filter="url(#glow-subtle)"/>
    <circle cx="340" cy="80" r="5" fill="#a855f7" filter="url(#glow-subtle)"/>
    <circle cx="460" cy="30" r="7" fill="#34d399" filter="url(#glow)"/>
    <circle cx="460" cy="30" r="14" fill="#34d399" opacity="0.3" class="pulsing-orb"/>

    <!-- Floating Financial Cards / AI Badges -->
    <g class="floating-node" transform="translate(260, 20)">
      <rect width="170" height="42" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="20" cy="21" r="6" fill="#34d399"/>
      <text x="36" y="19" fill="#f8fafc" class="badge-text">SEC EDGAR RAG</text>
      <text x="36" y="32" fill="#94a3b8" font-size="10" font-family="sans-serif">Real-Time Transcripts</text>
    </g>

    <g class="floating-node" transform="translate(60, 80)" style="animation-delay: -2s;">
      <rect width="150" height="42" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="20" cy="21" r="6" fill="#818cf8"/>
      <text x="36" y="19" fill="#f8fafc" class="badge-text">13F &amp; Quant Alpha</text>
      <text x="36" y="32" fill="#94a3b8" font-size="10" font-family="sans-serif">Institutional Intel</text>
    </g>
  </g>

  <!-- Left-side Text & Typography -->
  <g transform="translate(60, 75)">
    <!-- Pill Category Badge -->
    <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="14" cy="14" r="5" fill="#38bdf8"/>
    <text x="28" y="18" fill="#38bdf8" class="badge-text" letter-spacing="0.5">CURATED RESEARCH ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-size="38" class="title-text">
      Awesome Investment Research
    </text>
    <text x="0" y="122" fill="url(#brandGrad)" font-size="38" class="title-text">
      Platforms &amp; AI Tools ⚡
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="160" fill="#94a3b8" font-size="15" class="subtitle-text">
      Curated index of SaaS Intelligence, SEC EDGAR RAG, Expert Transcripts,
    </text>
    <text x="0" y="182" fill="#94a3b8" font-size="15" class="subtitle-text">
      Market Data APIs, and Open-Source Quantitative Alpha Platforms.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 210)">
      <!-- Tag 1 -->
      <rect width="115" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif">📊 Market Data</text>

      <!-- Tag 2 -->
      <rect x="125" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="137" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif">📑 SEC Filings &amp; 13F</text>

      <!-- Tag 3 -->
      <rect x="265" width="125" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="277" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif">🤖 AI &amp; LLM Agents</text>

      <!-- Tag 4 -->
      <rect x="400" width="125" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="412" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif">🔓 Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" rx="2" fill="url(#brandGrad)"/>
</svg>
